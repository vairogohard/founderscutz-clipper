name: Clips maken

on:
  schedule:
    - cron: "0 3 * * *"        # elke nacht om 03:00 UTC (04:00 of 05:00 Nederlandse tijd)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: clipper-state
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: ffmpeg installeren
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Spraakmodel bewaren tussen de rondes
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-${{ hashFiles('config.yml') }}
      - run: pip install -q -r requirements.txt
      - name: Clips maken en naar Telegram sturen
        run: python -m clipper.generate
      - name: Clips online zetten
        if: always()
        run: bash tools/publish_pages.sh
      - name: Status opslaan
        if: always()
        run: |
          git config user.name "clipper-bot"
          git config user.email "clipper-bot@users.noreply.github.com"
          git add state/state.json
          git diff --cached --quiet || git commit -m "status bijgewerkt"
          git pull --rebase --quiet
          git push --quiet
