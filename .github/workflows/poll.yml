name: Goedkeuringen verwerken

on:
  schedule:
    - cron: "*/15 * * * *"     # elk kwartier
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: clipper-state
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-poll.txt
      - run: pip install -q -r requirements-poll.txt
      - name: Tikken en opdrachten uit Telegram verwerken
        run: python -m clipper.poll
      - name: Status opslaan
        if: always()
        run: |
          git config user.name "clipper-bot"
          git config user.email "clipper-bot@users.noreply.github.com"
          git add state/state.json
          git diff --cached --quiet || git commit -m "status bijgewerkt"
          git pull --rebase --quiet
          git push --quiet
